name: paymoon
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: paymoon
      POSTGRES_PASSWORD: paymoon_local_only
      POSTGRES_DB: paymoon_dev
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["commerce-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymoon -d paymoon_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["commerce-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  commerce-postgres:
  commerce-redis:
